  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #000;
      color: #f2f2f2;
      font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
      text-align: center;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem 2rem;
    }
    .logo {
      width: min(82vw, 560px);
      height: auto;
      display: block;
      opacity: 0;
      animation: fadeUp 1.4s cubic-bezier(.2,.7,.2,1) .15s forwards;
    }
    .divider {
      width: 48px;
      height: 1px;
      background: #c9a24a;
      margin: 2.75rem auto 2rem;
      opacity: 0;
      animation: fadeIn 1.2s ease .9s forwards;
    }
    h1 {
      font-weight: 300;
      font-size: clamp(2.1rem, 9vw, 4.25rem);
      letter-spacing: .14em;
      text-transform: uppercase;
      line-height: 1.1;
      opacity: 0;
      animation: fadeUp 1.3s cubic-bezier(.2,.7,.2,1) 1.1s forwards;
    }
    .tagline {
      margin-top: 1.1rem;
      font-weight: 400;
      font-size: clamp(.95rem, 3.6vw, 1.25rem);
      letter-spacing: .32em;
      text-transform: uppercase;
      color: #c9a24a;
      opacity: 0;
      animation: fadeUp 1.3s cubic-bezier(.2,.7,.2,1) 1.5s forwards;
    }
    footer {
      padding: 1.5rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
      font-size: .75rem;
      letter-spacing: .08em;
      color: #8a8a8a;
      opacity: 0;
      animation: fadeIn 1.2s ease 2s forwards;
    }
    footer a { color: #b5b5b5; text-decoration: none; border-bottom: 1px solid #444; transition: color .2s, border-color .2s; }
    footer a:hover, footer a:focus-visible { color: #c9a24a; border-color: #c9a24a; outline: none; }
    .sep { margin: 0 .5em; color: #555; }
    @media (max-width: 480px) {
      footer .contact { display: block; margin-top: .5rem; }
      footer .contact .sep { display: none; }
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .logo, .divider, h1, .tagline, footer { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main>
    <picture>
      <source srcset="evruc-logo.webp" type="image/webp">
      <img class="logo" src="evruc-logo.png" width="1400" height="472" alt="EVRUC – Be part of the game">
    </picture>
    <div class="divider" aria-hidden="true"></div>
    <h1>Coming soon</h1>
    <p class="tagline">Stay tuned.</p>
  </main>
  <footer>
    <span>© 2026 EVRUC<span class="sep">·</span>Loyalty Fans GmbH</span><span class="contact"><span class="sep">·</span><a href="mailto:info@evruc.com">info@evruc.com</a></span>
  </footer>
</body>
