  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #000;

    }
    .divider {

      background: #c9a24a;
      margin: 2.75rem auto 2rem;
      opacity: 0;
      animation: fadeIn 1.2s ease .9s forwards;

    h1 {
      font-weight: 300;
      font-size: clamp(2.1rem, 9vw, 4.25rem);
      letter-spacing: .14em;
      text-transform: uppercase;
      line-height: 1.1;
      opacity: 0;
      animation: fadeUp 1.3s cubic-bezier(.2,.7,.2,1) 1.1s forwards;
    }
    .tagline {
      margin-top: 1.1rem;
      font-weight: 400;
      font-size: clamp(.95rem, 3.6vw, 1.25rem);
      letter-spacing: .32em;
      text-transform: uppercase;
      color: #c9a24a;
      opacity: 0;
      animation: fadeUp 1.3s cubic-bezier(.2,.7,.2,1) 1.5s forwards;
    }
    .about {

      letter-spacing: .12em;
      line-height: 1.7;
      color: #9a9a9a;
      opacity: 0;
      animation: fadeIn 1.2s ease 1.8s forwards;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    footer {
      padding: 1.5rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
      font-size: .75rem;
      letter-spacing: .08em;
      color: #8a8a8a;
      opacity: 0;
      animation: fadeIn 1.2s ease 2s forwards;
    }
    footer a { color: #b5b5b5; text-decoration: none; border-bottom: 1px solid #444; transition: color .2s, border-color .2s; }
    footer a:hover, footer a:focus-visible { color: #c9a24a; border-color: #c9a24a; outline: none; }
    .sep { margin: 0 .5em; color: #555; }
    @media (max-width: 480px) {
      footer .contact { display: block; margin-top: .5rem; }
      footer .contact .sep { display: none; }
    }
    .cookie-banner {
      position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(calc(100% - 2rem), 34rem);
      background: #111; border: 1px solid #2a2a2a; border-radius: 6px;
      padding: .9rem 1rem; z-index: 1000;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .75rem 1rem;
      font-size: .78rem; line-height: 1.5; letter-spacing: .03em; color: #b5b5b5; text-align: left;
      box-shadow: 0 4px 24px rgba(0,0,0,.6);
    }
    .cookie-banner[hidden] { display: none; }
    .cookie-banner p { flex: 1 1 16rem; }
    .cookie-actions { display: flex; gap: .6rem; }
    .cookie-banner button {
      font: inherit; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase;
      min-width: 6.5rem; padding: .5rem .9rem; cursor: pointer;
      background: transparent; color: #f2f2f2; border: 1px solid #c9a24a; border-radius: 4px;
      transition: background .2s, color .2s;

    .cookie-banner button:hover, .cookie-banner button:focus-visible { background: #c9a24a; color: #000; outline: none; }
    .cookie-link { background: none; border: 0; border-bottom: 1px solid #444; color: #b5b5b5; font: inherit; letter-spacing: inherit; cursor: pointer; padding: 0; transition: color .2s, border-color .2s; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {

    </div>
  </div>
  <script>
    (function () {
      var KEY = 'evruc_consent';
      var banner = document.getElementById('cookie-banner');
      function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
      function save(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
      function clearGaCookies() {
        document.cookie.split(';').forEach(function (c) {
          var name = c.split('=')[0].trim();
          if (name === '_ga' || name.indexOf('_ga_') === 0) {
            ['', '; domain=.evruc.com', '; domain=evruc.com'].forEach(function (d) {
              document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/' + d;
            });
          }
        });
      }
      function choose(v) {
        save(v);
        gtag('consent', 'update', { 'analytics_storage': v === 'granted' ? 'granted' : 'denied' });
        if (v !== 'granted') clearGaCookies();
        banner.hidden = true;
      }
      document.getElementById('cookie-accept').addEventListener('click', function () { choose('granted'); });
      document.getElementById('cookie-decline').addEventListener('click', function () { choose('denied'); });
      document.getElementById('cookie-settings').addEventListener('click', function () { banner.hidden = false; });
      var v = stored();
      if (v !== 'granted' && v !== 'denied') banner.hidden = false;
    })();
  </script>
